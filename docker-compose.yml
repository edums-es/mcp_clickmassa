version: "3.8"

services:
  clickmassa-mcp:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && node src/index-sse.js"
    environment:
      - CLICKMASSA_BASE_URL=${CLICKMASSA_BASE_URL}
      - CLICKMASSA_TOKEN=${CLICKMASSA_TOKEN}
      - CLICKMASSA_CANAL_ID=${CLICKMASSA_CANAL_ID}
      - PORT=3100
    ports:
      - "3100:3100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
